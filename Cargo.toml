[package]
name = "mcp-guardrails"
version = "0.1.0"
edition = "2021"
description = "MCP tool-call guardrails webhook for agentgateway — credential scanning, tool-level RBAC, and audit logging"
license = "Apache-2.0"
repository = "https://github.com/ExpertVagabond/mcp-guardrails-gateway"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
